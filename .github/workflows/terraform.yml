name: terraform

# PR  -> fmt + validate + plan of every stack (plan posted as a PR comment)
# main -> apply: core first, then the four phase stacks in parallel

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", "src/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "src/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_suffix: ${{ vars.SUFFIX }}
  TF_VERSION: "1.10.5"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lambda unit tests
        run: |
          if compgen -G "src/lambdas/*/test_*.py" > /dev/null; then
            pip install -q pytest boto3 pandas pyarrow
            pytest -q src/lambdas
          else
            echo "No Lambda tests yet"
          fi

  core:
    needs: checks
    runs-on: ubuntu-latest
    concurrency: tf-core
    defaults:
      run:
        working-directory: infra/core
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=core/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
      - run: terraform validate
      - name: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/core/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: "### Terraform plan · `core`\n<details><summary>Show plan</summary>\n\n```\n" + plan + "\n```\n</details>"
            });
      - name: apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

  stacks:
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [ingestion, processing, ml-alerts, web-api]
    concurrency: tf-${{ matrix.stack }}
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ matrix.stack }}/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
      - run: terraform validate
      - name: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const stack = process.env.STACK;
            const plan = fs.readFileSync(`infra/${stack}/plan.txt`, 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: "### Terraform plan · `" + stack + "`\n<details><summary>Show plan</summary>\n\n```\n" + plan + "\n```\n</details>"
            });
      - name: apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
